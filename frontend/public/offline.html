<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Offline — MaapSetu</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F4EE;color:#1b2a2a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
      .card{max-width:380px}
      img{width:72px;height:72px}
      h1{font-size:1.3rem;margin:16px 0 8px}
      p{color:#475569;line-height:1.5;margin:0 0 20px}
      button{background:#1F5F5B;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer}
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>MaapSetu needs an internet connection to load your data. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
