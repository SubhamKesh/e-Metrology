# Load balancer for the multi-instance rehearsal stack (docker-compose.scale.yml).
#
# Spreads requests across every `backend` replica, passes WebSockets through,
# gives the app the REAL client IP, and applies a coarse per-IP request limit
# in front of the app's own protections.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Using a variable in proxy_pass (below) makes nginx
    # re-resolve `backend` every 10 s, so replicas that restart or are added with
    # `--scale` are picked up without reloading nginx; all A records are used
    # round-robin.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The WebSocket URL carries the user's access token in its query string
    # (/ws/notifications?token=...). Log the PATH only ($uri, never $request or
    # $request_uri) so tokens never reach the access log.
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log safe;

    # Coarse flood control per client IP (the app has its own, finer, limits).
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
    limit_req_status 429;

    server_tokens off;

    # The app itself rejects bodies over MAX_REQUEST_BODY_BYTES (2 MB default)
    # with a proper JSON error; allow slightly more here so that message, not a
    # bare nginx 413, is what the client sees.
    client_max_body_size 3m;

    server {
        listen 80;

        # Always overwrite (never append to) X-Forwarded-For. The app trusts the
        # FIRST address in it for rate limiting, lockout and the audit log; if
        # nginx appended to a header the client supplied, an attacker could
        # choose their own "IP" simply by sending one.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Health probe for the load balancer / orchestrator: not rate limited, not logged.
        location = /api/v1/health {
            access_log off;
            set $upstream http://backend:8000;
            proxy_pass $upstream;
        }

        # Real-time notifications (WebSocket). Long-lived; the app fans messages
        # out over Redis, so ANY replica can serve any user — no sticky sessions.
        location /ws/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=per_ip burst=60 nodelay;
            set $upstream http://backend:8000;
            proxy_pass $upstream;
            proxy_read_timeout 60s;
        }
    }
}
