# Local dev convenience only — NOT the production deployment shape.
# Runs the backend + a local Mongo so nobody needs Atlas creds just to
# poke at the API. Production still targets Atlas + Render/Railway per
# the existing team plan (see docs/).
version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Optional — only needed to exercise the Redis-backed DDoS-protection
  # store locally (see backend/app/middleware/ddos_store.py). Not required
  # for local dev otherwise; the app falls back to in-memory state without
  # it. Uncomment REDIS_URL below (and this service) to opt in.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: maapsetu
      ENVIRONMENT: development
      JWT_SECRET: dev_secret_change_me
      COOKIE_SECURE: "false" # set true once served over HTTPS
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # REDIS_URL: redis://redis:6379/0  # uncomment + `docker compose --profile redis up` to test the Redis-backed DDoS store
    depends_on:
      - mongo

volumes:
  mongo_data:
