name: CI

# Runs on every push and PR so a broken build/test never lands on main
# unnoticed — "lint -> test -> build -> deploy". The deploy job only runs on
# pushes to main, only after every check above has passed, and only if you have
# added the matching repository secret (Settings -> Secrets and variables ->
# Actions); with no secret it does nothing, so this file is safe as-is.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest mongomock

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github

      - name: Test (pytest, against mongomock — no real DB needed)
        run: pytest tests/ -v

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  docker-build:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed — just proves the Dockerfile works)
        run: docker build -t maapsetu-backend:ci ./backend

  compose-config:
    name: Docker Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both compose files (dummy secrets, nothing is started)
        env:
          JWT_SECRET: ci-dummy
          OTP_PEPPER: ci-dummy
          MFA_ENCRYPTION_KEY: ci-dummy
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.scale.yml config -q

  deploy:
    name: Deploy (runs only if deploy-hook secrets are set)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build, compose-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never let two deploys race each other.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # Render: Dashboard -> your service -> Settings -> Deploy Hook -> copy the URL
      # into a repo secret named RENDER_DEPLOY_HOOK_URL, then set the service's
      # "Auto-Deploy" to "Off" (or "After CI Checks Pass") so it deploys from here
      # once, instead of on every push regardless of test results.
      - name: Deploy backend to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL is not set - skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK"
          echo "Render deploy triggered."

      # Vercel deploys from the Git integration by itself. Only add this secret
      # (Project -> Settings -> Git -> Deploy Hooks) if you turned that off.
      - name: Deploy frontend to Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL is not set - skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK"
          echo "Vercel deploy triggered."
