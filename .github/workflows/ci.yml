name: CI

# Runs on every push and PR so a broken build/test never lands on main
# unnoticed — matches the checklist's "lint -> test -> build -> deploy"
# pipeline shape. Deploy is intentionally left out: this repo doesn't have
# a target deploy environment/secrets configured yet, so add a deploy job
# once Render/Railway/Vercel credentials exist as repo secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest mongomock

      - name: Lint (ruff)
        run: ruff check app/ --output-format=github

      - name: Test (pytest, against mongomock — no real DB needed)
        run: pytest tests/ -v

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  docker-build:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed — just proves the Dockerfile works)
        run: docker build -t maapsetu-backend:ci ./backend
