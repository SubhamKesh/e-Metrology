# Render Blueprint for e-Metrology (MaapSetu)
# Dashboard -> New -> Blueprint -> pick this repo.
# Replace the two onrender.com URLs below if Render gives your services different names.
services:
  # ---------- Backend: FastAPI in Docker ----------
  - type: web
    name: maapsetu-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"            # Dockerfile binds uvicorn to 8000
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none              # frontend + API are on different onrender.com subdomains (cross-site)
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER          # hashes signup + password-reset codes
        generateValue: true
      - key: MFA_ENCRYPTION_KEY  # encrypts officer/admin authenticator secrets.
        generateValue: true      # NEVER change or delete it once officers have enrolled (they would all need a 2-step reset).
      - key: DB_NAME
        value: maapsetu
      - key: MONGO_URI
        sync: false              # Atlas connection string
      - key: CORS_ALLOWED_ORIGINS
        value: https://maapsetu-web.onrender.com
      - key: FRONTEND_LOGIN_URL
        value: https://maapsetu-web.onrender.com/login
      - key: FRONTEND_BASE_URL
        value: https://maapsetu-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # Brevo HTTPS API (port 443). Preferred over SMTP on Render; used when set together with SMTP_FROM.
      - key: BREVO_API_KEY
        sync: false
      # Shared Redis: job queue (certificates, emails), rate limits, WebSocket fan-out across instances.
      - key: REDIS_URL
        sync: false
      # Run the queue worker inside this web service (works on the free plan). Set to "false"
      # if you deploy the dedicated worker service below.
      - key: EMBEDDED_WORKER
        value: "true"
      # Inspection scheduling (all optional; these are the defaults).
      # Max inspections one officer can take in a single slot (morning or afternoon).
      - key: SLOT_CAPACITY_PER_OFFICER
        value: "4"
      # Earliest bookable date, in days from today (0 = today is allowed).
      - key: SCHEDULE_MIN_LEAD_DAYS
        value: "0"
      # How far ahead an inspection can be booked.
      - key: SCHEDULE_MAX_AHEAD_DAYS
        value: "60"
      # Field verification form: a Pass must carry test readings, every required check and a seal
      # number. Set "false" only while old app versions or inspections queued on phones before the
      # upgrade still need to be accepted.
      - key: INSPECTION_FORM_STRICT
        value: "true"
      # CSV / PDF report export: the most rows one download may hold (newest first). The file and
      # the response say when more matched.
      - key: REPORT_MAX_ROWS
        value: "5000"
      # Oversight pages: days an open application may wait before it counts as overdue, and the most
      # lapsed instruments one enforcement request will list (safety ceiling).
      - key: PENDENCY_TARGET_DAYS
        value: "30"
      - key: ENFORCEMENT_MAX_SCAN
        value: "50000"
      # Enforcement cases: days after registration before a never-certified instrument is listed, days
      # after the last notice before an unanswered case moves up a level, and days between two notices.
      - key: NEVER_CERTIFIED_GRACE_DAYS
        value: "30"
      - key: ESCALATION_AFTER_DAYS
        value: "15"
      - key: NOTICE_MIN_GAP_DAYS
        value: "3"
      # How many days a new certificate is valid when its instrument type has no period of its own
      # (admins set per-type periods in the app: Admin > Certificate validity).
      - key: DEFAULT_CERT_VALIDITY_DAYS
        value: "365"

  # ---------- Optional: dedicated queue worker (paid plans only) ----------
  # Render's free plan has no Background Workers. On a paid plan, uncomment this, set
  # EMBEDDED_WORKER=false above, and certificate PDFs stop competing with API requests for CPU.
  # - type: worker
  #   name: maapsetu-worker
  #   runtime: docker
  #   rootDir: backend
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   dockerCommand: python run_worker.py
  #   envVars:            # same MONGO_URI, DB_NAME, REDIS_URL, CLOUDINARY_*, BREVO_API_KEY, SMTP_*, MFA_ENCRYPTION_KEY, JWT_SECRET as the API
  #     - key: REDIS_URL
  #       sync: false

  # ---------- Frontend: Vite/React static site ----------
  - type: web
    name: maapsetu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://maapsetu-api.onrender.com
      # Public canonical origin for SEO (canonical URLs, sitemap, robots). Set it to your real domain;
      # until then the build falls back to the Render URL with a warning.
      - key: VITE_SITE_URL
        sync: false
    # `npm run build` prerenders the public pages (scripts/prerender.mjs), so Render serves real files
    # for them. Authenticated app routes and /verify/<id> use the generic noindex shell. Unknown URLs
    # get dist/404.html with a real 404 (no catch-all rewrite). Keep in sync with vercel.json.
    routes:
      - type: rewrite
        source: /app/*
        destination: /app-shell.html
      - type: rewrite
        source: /verify/*
        destination: /app-shell.html
      - type: rewrite
        source: /verify
        destination: /verify/index.html
      - type: rewrite
        source: /register
        destination: /register/index.html
      - type: rewrite
        source: /how-it-works
        destination: /how-it-works/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /forgot-password
        destination: /forgot-password.html
      - type: rewrite
        source: /two-step
        destination: /two-step.html
      - type: rewrite
        source: /pending
        destination: /pending.html
      - type: rewrite
        source: /change-password
        destination: /change-password.html
      - type: rewrite
        source: /unauthorized
        destination: /unauthorized.html
    # CDN: Render serves static sites through its CDN. These headers tell the CDN
    # and browsers that Vite's hashed files (/assets/*, renamed on every build)
    # can be cached for a year, while index.html is always re-checked so a new
    # deploy shows up immediately.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Service worker must always be re-fetched so new releases reach installed apps.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /offline.html
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=3600
